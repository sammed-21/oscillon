name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Print versions
        run: |
          forge --version
          forge solc --version

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

    lint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            submodules: recursive

        - uses: foundry-rs/foundry-toolchain@v1

        - name: Check formatting
          run: forge fmt --check
