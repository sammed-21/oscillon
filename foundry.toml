[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc_version = '0.8.26'
evm_versoin = 'cancun'
optimizer_runs = 800
via_ir = false

fs_permissions = [
  { access = "read-write", path = "./deployment.json" },
  { access = "read-write", path = "./oscillon-ui/src/deployment.json" },
]

[profile.ci]
ffi = false
optimizer = true
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
